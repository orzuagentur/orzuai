# Personal WhatsApp (Web/QR, Baileys) worker.
# Deploy from repo root so npm workspaces resolve @orzu/whatsapp-web.

[build]
builder = "RAILPACK"
watchPatterns = ["apps/whatsapp-web/**", "package.json", "package-lock.json", "packages/secrets/**"]

[deploy]
startCommand = "node --import tsx apps/whatsapp-web/src/index.ts"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
