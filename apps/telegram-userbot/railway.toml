# Personal Telegram (MTProto/GramJS) worker.
# Deploy from repo root so npm workspaces resolve @orzu/telegram-userbot.

[build]
builder = "RAILPACK"
watchPatterns = ["apps/telegram-userbot/**", "package.json", "package-lock.json", "packages/secrets/**"]

[deploy]
startCommand = "node --import tsx apps/telegram-userbot/src/index.ts"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
